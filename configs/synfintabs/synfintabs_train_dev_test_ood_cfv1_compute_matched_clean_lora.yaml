experiment:
  name: synfintabs_train_dev_test_ood_cfv1_compute_matched_clean_lora
  seed: 20260804
  selection_metric: numeric_accuracy

model:
  base_model_path: /path/to/models/Qwen3-VL-4B-Instruct
  local_files_only: true
  device_map: auto
  torch_dtype: bfloat16
  attn_implementation:
  gradient_checkpointing: true

data:
  root_dir: ~/runs/cf-vlm-financial-grounding/synfintabs_train_dev_test_ood_cfv1_seed_20260804
  train_manifest: manifest_train.jsonl
  # Generated by scripts/generate_compute_matched_clean_b.py -- clean_a comes
  # from data.root_dir/manifest_train.jsonl's existing "clean" variant.
  clean_b_root: ~/runs/cf-vlm-financial-grounding/synfintabs_train_dev_test_ood_cfv1_clean_b_seed_20260804
  clean_b_manifest: clean_b_manifest.jsonl
  prompt_style: standard_qa

# 1 cycle = each of the 1000 train groups visited once with its fixed
# (clean_A, clean_B) pair; num_cycles=3 -> 3 visits total per group
# (CF-augmentation's num_cycles=1 also visits each group 3x, once per CF
# type -- the two configs' "num_cycles" aren't the same unit). Matches the
# CF-augmentation sweep's 3000 pairs / 6000 image presentations / ~188
# optimizer steps exactly, so training-loss step count lines up too.
pairing:
  num_cycles: 3

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  save_strategy: steps
  bf16: true
  fp16: false
  gradient_checkpointing: true
  max_grad_norm: 1.0
  dataloader_num_workers: 0
  report_to: none

output:
  root_dir: ~/runs/cf-vlm-financial-grounding/synfintabs_train_dev_test_ood_cfv1_compute_matched_clean_lora_seed_20260804
