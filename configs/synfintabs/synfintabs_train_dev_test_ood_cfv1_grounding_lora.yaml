experiment:
  name: synfintabs_train_dev_test_ood_cfv1_grounding_lora
  seed: 20260804
  selection_metric: numeric_accuracy

model:
  base_model_path: /path/to/models/Qwen3-VL-4B-Instruct
  local_files_only: true
  device_map: auto
  torch_dtype: bfloat16
  attn_implementation:
  gradient_checkpointing: true

data:
  root_dir: ~/runs/cf-vlm-financial-grounding/synfintabs_train_dev_test_ood_cfv1_seed_20260804
  train_manifest: manifest_train.jsonl
  dev_manifest: manifest_dev.jsonl
  test_manifest: manifest_test.jsonl

# Same LoRA config, training budget, and hyperparameters as Standard LoRA
# (configs/synfintabs_train_dev_test_ood_cfv1_qa_lora.yaml) -- the only
# difference is the supervision target (train_grounding_lora.py), not the
# training setup.
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  save_strategy: steps
  bf16: true
  fp16: false
  gradient_checkpointing: true
  max_grad_norm: 1.0
  dataloader_num_workers: 0
  report_to: none

output:
  root_dir: ~/runs/cf-vlm-financial-grounding/synfintabs_train_dev_test_ood_cfv1_grounding_lora_seed_20260804
